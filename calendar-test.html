<input type="checkbox" id="restoreConfirm">我已检查恢复前资料下载妥当，并审核以上内容；同意替换工作和生活的全部数据。</label><div class="actions"><button type="button" class="primary" id="commitRestore" disabled>确认替换并保存</button><button type="button" onclick="closeRestore()">取消，不更改数据</button></div></dialog><div id="toast" class="toast hidden" role="status"></div>

'use strict';
const $=id=>document.getElementById(id),KEY='daily-cockpit-calendar-test-v1';let scope='life',view='today',query='',storageOK=true;let now=new Date();const dateKey=d=>{let x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};let today=dateKey(now);const dayAt=(offset,time)=>{let d=new Date(now);d.setDate(d.getDate()+offset);return dateKey(d)+'T'+time};
const sample={projects:[{id:'p1',name:'验证流程整理 · 示例',kind:'work'},{id:'p2',name:'AI 学习笔记 · 示例',kind:'life'}],tasks:[{id:'t1',kind:'work',title:'核对验证流程说明 · 示例',project:'p1',due:dayAt(-1,'17:00'),quadrant:'重要且紧急',progress:'已整理初稿',next:'核对两处待确认说明',status:'todo',remind:''},{id:'t2',kind:'work',title:'整理一周工作记录 · 示例',project:'p1',due:dayAt(0,'17:30'),quadrant:'重要不紧急',progress:'等待补充',next:'确认后保存总结',status:'todo',remind:''},{id:'t3',kind:'life',title:'散步 20 分钟 · 示例',project:'',due:dayAt(0,'18:30'),quadrant:'重要不紧急',progress:'',next:'按自己的节奏出发',status:'todo',remind:'18:30'},{id:'t4',kind:'life',title:'整理一个 AI 小技巧 · 示例',project:'p2',due:'',quadrant:'重要不紧急',progress:'已收藏一个例子',next:'用自己的话写两句',status:'todo',remind:''}],records:[]};const quadrantValues=['重要不紧急','重要且紧急','紧急不重要','不重要不紧急'];

function validState(value){
 const obj=x=>x&&typeof x==='object'&&!Array.isArray(x),str=x=>typeof x==='string',kind=x=>['work','life'].includes(x),id=x=>str(x)&&/^[A-Za-z0-9_-]{1,100}$/.test(x);
 if(!obj(value)||!['tasks','projects','records'].every(k=>Array.isArray(value[k])&&value[k].every(x=>obj(x)&&id(x.id))&&new Set(value[k].map(x=>x.id)).size===value[k].length))return false;
 const project=x=>x===''||value.projects.some(p=>p.id===x);
 return value.projects.every(p=>str(p.name)&&p.name.trim()&&kind(p.kind))&&value.tasks.every(t=>kind(t.kind)&&str(t.title)&&t.title.trim()&&project(t.project)&&validDue(t.due)&&quadrantValues.includes(t.quadrant)&&['todo','done','skip'].includes(t.status)&&!(t.kind==='work'&&t.status==='skip')&&['progress','next','remind'].every(k=>t[k]===undefined||str(t[k])))&&value.records.every(r=>kind(r.kind)&&validDate(r.date)&&project(r.project)&&str(r.text)&&r.text.trim()&&str(r.reviewedAt)&&Number.isFinite(Date.parse(r.reviewedAt))&&(r.type===undefined||str(r.type)));
}
let state,persistedRaw=null,rawRecovery=null,loadBlocked=false,storageIssue='',dirty=false,lastStatusChange=null,recordScope='life';
let readCompleted=false;
try{persistedRaw=localStorage.getItem(KEY);readCompleted=true;const loaded=persistedRaw===null?structuredClone(sample):JSON.parse(persistedRaw);if(!validState(loaded))throw Error('invalid data');state=loaded}catch{state=structuredClone(sample);rawRecovery=persistedRaw;loadBlocked=true;storageOK=false;storageIssue=readCompleted?'原有数据格式异常，已停止写入以防覆盖。当前显示的是示例数据；请先导出原始存储。':'浏览器存储无法读取，已停止写入以防覆盖。当前显示的是示例数据；如有修改请先导出当前页面数据，再刷新重试。'}
const draftFields={editor:['taskId','title','kind','project','due','quadrant','progressText','next','remind'],projectDialog:['projectTitle','projectKind'],recordDialog:['recordType','recordDate','recordProject','recordText']},draftSnapshots=new Map();
function draftValue(id){return JSON.stringify(draftFields[id].map(name=>$(name).value))}
function beginDraft(id){draftSnapshots.set(id,draftValue(id));$(id).showModal()}
function draftChanged(id){return $(id).open&&draftSnapshots.has(id)&&draftSnapshots.get(id)!==draftValue(id)}

function finishDraft(id){draftSnapshots.delete(id);$(id).close()}
function save(){

 try{
  if(loadBlocked)throw Error('blocked');
  const current=localStorage.getItem(KEY);
  if(current!==persistedRaw){rawRecovery=current;storageIssue='另一个页面已更改存储，写入已暂停。请导出当前页面数据和原始存储，再刷新核对；不会自动合并或覆盖。';throw Error('conflict')}

}
function downloadText(text,name,type='application/json'){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);say('已请求浏览器下载，请检查下载文件是否成功保存')}
const BACKUP_FORMAT='daily-cockpit-backup',BACKUP_VERSION=1,MAX_BACKUP_BYTES=5*1024*1024,MAX_BACKUP_ITEMS=5000;
function backupError(message){throw Error(message)}
function backupObject(value,allowed,label){if(!value||typeof value!=='object'||Array.isArray(value))backupError(label+'必须是对象');for(const key of Object.keys(value))if(!allowed.includes(key))backupError(label+'含不支持的字段：'+key)}
function backupString(value,max,label,empty=true){if(typeof value!=='string'||value.length>max||(!empty&&!value.trim()))backupError(label+'不是有效文本或超出长度限制');return value}
function backupISO(value,label){if(typeof value!=='string'||!/^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\.\d{3}Z$/.test(value)||!Number.isFinite(Date.parse(value))||new Date(value).toISOString()!==value)backupError(label+'不是有效的导出时间');return value}

 backupObject(value,['projects','tasks','records'],'备份内容');
 for(const key of ['projects','tasks','records'])if(!Array.isArray(value[key])||value[key].length>MAX_BACKUP_ITEMS)backupError(key+'须为数组，且不能超过 '+MAX_BACKUP_ITEMS+' 项');
 const identity=(x,label)=>{backupString(x.id,100,label+'标识',false);if(!/^[A-Za-z0-9_-]+$/.test(x.id))backupError(label+'标识格式错误');if(!['work','life'].includes(x.kind))backupError(label+'分类无效')};

 const tasks=value.tasks.map(t=>{backupObject(t,['id','title','kind','project','due','quadrant','progress','next','status','remind'],'任务');identity(t,'任务');if(!validDue(t.due))backupError('任务截止日期无效');if(!quadrantValues.includes(t.quadrant))backupError('任务四象限无效');if(!['todo','done','skip'].includes(t.status)||(t.kind==='work'&&t.status==='skip'))backupError('任务状态无效');const remind=t.remind===undefined?'':backupString(t.remind,5,'提醒时间');if(remind&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(remind))backupError('生活提醒时间无效');return {id:t.id,title:backupString(t.title,120,'任务名称',false),kind:t.kind,project:projectRef(t.project,'任务'),due:t.due,quadrant:t.quadrant,progress:backupString(t.progress===undefined?'':t.progress,300,'进展'),next:backupString(t.next===undefined?'':t.next,300,'下一步'),status:t.status,remind}});
 const records=value.records.map(r=>{backupObject(r,['id','kind','type','date','project','text','reviewedAt'],'记录');identity(r,'记录');if(!validDate(r.date))backupError('记录日期无效');const type=r.type===undefined?'日常记录':r.type;if(!['日常记录','待完成项目','项目进度','周总结'].includes(type))backupError('记录类型无效');return {id:r.id,kind:r.kind,type,date:r.date,project:projectRef(r.project,'记录'),text:backupString(r.text,20000,'记录正文',false),reviewedAt:backupISO(r.reviewedAt,'记录审核时间')}});
 for(const [label,items] of [['项目',projects],['任务',tasks],['记录',records]])if(new Set(items.map(x=>x.id)).size!==items.length)backupError(label+'标识重复');

}
function makeBackup(data=state){return {format:BACKUP_FORMAT,version:BACKUP_VERSION,prototype:true,exportedAt:new Date().toISOString(),...normalizeBackupData(data)}}
function backupText(data=state){const text=JSON.stringify(makeBackup(data),null,2);if(new Blob([text]).size>MAX_BACKUP_BYTES)backupError('备份超过 5 MiB 限制，不能在本版导入；未开始恢复');return text}
function parseBackup(text){

 if(!legacy&&(value.format!==BACKUP_FORMAT||value.version!==BACKUP_VERSION))backupError('备份格式或版本不兼容，仅支持本工作台 v1');

function icsEscape(value){return String(value||'').replace(/\\/g,'\\\\').replace(/\r\n|\r|\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,')}
function icsFold(line){let out='',bytes=0;for(const c of line){const n=c.codePointAt(0),size=n<=127?1:n<=2047?2:n<=65535?3:4;if(bytes+size>75){out+='\r\n ';bytes=1}out+=c;bytes+=size}return out}
function taskCalendar(t,stamp=new Date()){
 if(!t||!t.due||!validDue(t.due))throw Error('请先设置有效的截止日期和时间，不会自动编造。');
 const dt=t.due.replace(/[-:]/g,'')+(t.due.length===16?'00':'');
 const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Daily Workbench//Task Export//ZH','CALSCALE:GREGORIAN','BEGIN:VEVENT',
 'UID:workbench-'+String(t.id).replace(/[^A-Za-z0-9_-]/g,'')+'@daily-workbench.local',
 'DTSTAMP:'+stamp.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z'),
 'DTSTART:'+dt,'SUMMARY:'+icsEscape(t.title),
 'DESCRIPTION:'+icsEscape('从工作台手动导出；截止时间按导入设备本地时区解释。导入后不自动更新，请自行删除旧事件或核对重复。未附加提醒。'),
 'TRANSP:TRANSPARENT','END:VEVENT','END:VCALENDAR'];
 return lines.map(icsFold).join('\r\n')+'\r\n';
}

if(view==='settings'){html=`<section class="card" style="margin-top:24px"><h2>这版能做什么</h2><p>添加、编辑任务；关联项目；标记完成 / 跳过；关键词搜索；审核后保存记录；导出带版本的 JSON 备份、校验后审核恢复。</p><div class="rule"><strong>日历导出不是同步或提醒服务</strong><p class="sub">只有设置了有效截止日期和时间的任务才能导出 .ics。文件不包含提醒；请自行检查后导入日历。时间按导入设备本地时区解释，导入后不会自动更新；重复导入可能产生重复事件。未设日期的任务不会编造时间。</p></div><h2>尚未实现</h2><p>微信通知、定时后台执行、语音识别、AI 分析、天气接口、节假日日历、手机与电脑同步、自动定期备份。</p><div class="rule"><strong>数据保存</strong><p class="sub">仅尝试保存到当前浏览器的 localStorage，没有服务器、联网请求或加密。清理浏览器、隐私模式、换设备或移动文件可能造成数据丢失。不要用于真实重要记录。</p></div><div class="rule"><strong>提醒只显示规则，不会发送</strong><p class="sub">工作日 08:30 汇总；不做截止前提醒；无截止日期不追问。生活按计划时间。节假日和调班尚未实现。</p></div><div class="rule"><strong>离线与手机</strong><p class="sub">电脑可直接用浏览器打开此文件，页面不加载外部资源。iPhone 文件预览可能不执行交互代码；正式手机离线使用需要安装式网页、HTTPS 与缓存方案，并实机验证。本版没有这些能力。</p></div><div class="actions"><button id="export" class="primary">导出 JSON 备份 v1</button><button id="openRestore">导入备份并审核恢复</button></div><p class="sub">备份包括工作和生活的全部项目、任务与已审核记录，不包括尚未提交的表单草稿。恢复为整份替换，不会自动合并；取消或校验失败不改变现有数据。</p><p class="sub">下载到哪里由浏览器决定，不是自动备份到指定文件夹。</p></section>`}
$('content').innerHTML=html;$('storage').textContent=(storageOK?'仅保存在本设备当前浏览器 · 非正式数据库':'⚠ 保存不可用，改动仅在当前页面内存')+'　｜　不自动跨设备同步；手动导入备份会整份替换，不会合并';document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>edit());document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll('[data-calendar]').forEach(b=>b.onclick=()=>exportTaskCalendar(b.dataset.calendar));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>changeStatus(b.dataset.id,b.dataset.action));if($('search'))$('search').oninput=e=>{let pos=e.target.selectionStart;query=e.target.value;render();$('search').focus();$('search').setSelectionRange(pos,pos)};if($('newRecord'))$('newRecord').onclick=()=>{options($('recordProject'));$('recordDate').value=dateKey(new Date());recordScope=scope;$('recordText').value='';$('recordType').value='日常记录';beginDraft('recordDialog')};if($('recordFilter'))$('recordFilter').oninput=e=>$('recordList').innerHTML=recordHTML(e.target.value);if($('addProject'))$('addProject').onclick=()=>{$('projectTitle').value='';$('projectKind').value=scope;beginDraft('projectDialog')};if($('export'))$('export').onclick=exportState;if($('openRestore'))$('openRestore').onclick=openRestore;renderSaveNotice();}

function recordHTML(q){let r=state.records.filter(r=>r.kind===scope&&[r.date,projectName(r.project)].join(' ').includes(q));return r.map(r=>`<article class="record"><div class="row"><strong>${esc(r.date)}</strong><span class="pill">${esc(r.type||'日常记录')} · 已审核</span></div><div class="sub">${esc(projectName(r.project))}</div><p>${esc(r.text)}</p></article>`).join('')||'<div class="empty">还没有匹配的已审核记录。草稿不会自动保存。</div>'}
function options(el){el.innerHTML='<option value="">不关联项目</option>'+state.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}
function edit(id){let t=state.tasks.find(x=>x.id===id)||{kind:scope,quadrant:'重要不紧急'};$('editTitle').textContent=id?'查看 / 修改任务':'添加任务';options($('project'));for(let [a,b] of Object.entries({taskId:'id',title:'title',kind:'kind',project:'project',due:'due',quadrant:'quadrant',progressText:'progress',next:'next',remind:'remind'}))$(a).value=t[b]||'';beginDraft('editor')}

$('taskForm').onsubmit=e=>{e.preventDefault();if(!$('editor').open)return;let id=$('taskId').value,old=state.tasks.find(x=>x.id===id),t={id:id||crypto.randomUUID(),title:$('title').value.trim(),kind:$('kind').value,project:$('project').value,due:$('due').value,quadrant:$('quadrant').value,progress:$('progressText').value,next:$('next').value,remind:$('remind').value,status:old?.status||'todo'};
if(!t.title||!['work','life'].includes(t.kind)||!quadrantValues.includes(t.quadrant)||!validDue(t.due)||!(t.project===''||state.projects.some(p=>p.id===t.project))){say('请检查任务名称、分类、项目和有效截止日期');return}
if(id&&!old){say('原任务已不存在，请重新打开任务');return}const restored=t.kind==='work'&&t.status==='skip';if(restored)t.status='todo';if(old)Object.assign(old,t);else state.tasks.push(t);lastStatusChange=null;finishDraft('editor');save();say(storageOK?(restored?'已改为工作任务，并恢复待办状态':'任务已保存到本浏览器'):'保存失败，请重试或导出')};
$('projectForm').onsubmit=e=>{e.preventDefault();if(!$('projectDialog').open)return;let name=$('projectTitle').value.trim(),kind=$('projectKind').value;if(!name||!['work','life'].includes(kind))return;state.projects.push({id:crypto.randomUUID(),name,kind,reviewedAt:new Date().toISOString()});finishDraft('projectDialog');save();say(storageOK?'项目已审核并保存':'保存失败，请重试或导出')};
$('recordForm').onsubmit=e=>{e.preventDefault();if(!$('recordDialog').open)return;const text=$('recordText').value.trim(),date=$('recordDate').value,project=$('recordProject').value;if(!text||!validDate(date)||!(project===''||state.projects.some(p=>p.id===project))){say('请填写有效日期、正文并核对关联项目');return}state.records.push({id:crypto.randomUUID(),kind:recordScope,type:$('recordType').value,date,project,text,reviewedAt:new Date().toISOString()});finishDraft('recordDialog');save();say(storageOK?'已按你的确认保存记录':'保存失败，请重试或导出')};
document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;query='';render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;query='';render()});render();
</script></body></html>
